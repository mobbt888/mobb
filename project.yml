# XcodeGen 工程描述：xcodegen generate → CloudPhone.xcodeproj → xcodebuild archive → .ipa
# 工具安装：brew install xcodegen
name: CloudPhone

options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: none

settings:
  base:
    SWIFT_VERSION: "5.9"
    SDKROOT: iphoneos
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTED_PLATFORMS: iphoneos
    ENABLE_PREVIEWS: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      VALIDATE_PRODUCT: "YES"

targets:
  CloudPhone:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    info:
      properties:
        CFBundleDisplayName: 云手机
        CFBundleDevelopmentRegion: zh_CN
        UILaunchScreen:
          UIColorName: ""
        UIRequiredDeviceCapabilities:
          - arm64
        UIViewControllerBasedStatusBarAppearance: true
        UIUserInterfaceStyle: Automatic
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: false
        NSCameraUsageDescription: 云手机内的应用使用摄像头时需要此权限
        NSMicrophoneUsageDescription: 云手机内的应用使用麦克风时需要此权限
        NSPhotoLibraryAddUsageDescription: 用于保存云手机截图到相册
    entitlements:
      path: Resources/CloudPhone.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.js123.cloudphone
        PRODUCT_NAME: CloudPhone
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        # ⚠️ 必填：换成你自己的 Apple 开发者团队 ID（Xcode ▸ Settings ▸ Accounts 可见）
        DEVELOPMENT_TEAM: XXXXXXXXXX
        CODE_SIGN_IDENTITY: Apple Development
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
      configs:
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
          SWIFT_OPTIMIZATION_LEVEL: "-O"

schemes:
  CloudPhone:
    build:
      targets:
        CloudPhone: all
    run:
      config: Debug
    archive:
      config: Release
