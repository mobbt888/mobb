# 没有 Mac 也能拿到未签名 ipa：把本目录推到 GitHub，Actions ▸ Build unsigned IPA ▸ Run workflow
# 跑完在 Run 详情页底部的 Artifacts 下载 CloudPhone-unsigned-ipa。
name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: App 的 Bundle ID（换成你自己的，避免和签名证书不匹配）
        required: false
        default: com.js123.cloudphone
      site_url:
        description: 壳 App 打开的网页地址
        required: false
        default: https://h.js123.com.cn/#/

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Report checkout state
        run: |
          echo "=== HEAD ==="
          git rev-parse HEAD
          git log -1 --format='%ci | %an | %s'
          echo "=== Info.plist in workspace ==="
          wc -c Resources/Info.plist
          md5 Resources/Info.plist
          echo "=== same file via raw githubusercontent ==="
          curl -sS "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/Resources/Info.plist" | wc -c

      # XcodeGen 2.46 生成 Xcode 16 的工程格式（objectVersion 77），
      # Xcode 15 打不开（future Xcode project file format），必须显式切到最新的 Xcode 16。
      - name: Select latest Xcode
        run: |
          XC="$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)"
          echo "selected: $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Override bundle id and site url
        run: |
          perl -pi -e "s{https://h\.js123\.com\.cn/#/}{${{ github.event.inputs.site_url }}}g" Sources/Support/AppConfig.swift
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER: .*/PRODUCT_BUNDLE_IDENTIFIER: ${{ github.event.inputs.bundle_id }}/" project.yml

      - name: Build unsigned IPA
        run: bash Scripts/build_ipa.sh unsigned

      - name: Show bundled Info.plist
        run: |
          echo "=== SOURCE Resources/Info.plist ==="
          ls -la Resources/Info.plist
          head -c 400 Resources/Info.plist
          echo ""
          plutil -p Resources/Info.plist
          echo "=== BUNDLED Info.plist ==="
          ls -la build/Build/Products/Release-iphoneos/CloudPhone.app
          plutil -p build/Build/Products/Release-iphoneos/CloudPhone.app/Info.plist

      - uses: actions/upload-artifact@v4
        with:
          name: CloudPhone-unsigned-ipa
          path: build/*.ipa
          if-no-files-found: error
